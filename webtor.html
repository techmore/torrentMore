<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>WebTorrent video player</title>
    <style>
      #output video {
        width: 100%;
      }
      #progressBar {
          height: 5px;
          width: 0%;
          background-color: #35b44f;
          transition: width .4s ease-in-out;
      }
      body.is-seed .show-seed {
          display: inline;
      }
      body.is-seed .show-leech {
          display: none;
      }
      .show-seed {
          display: none;
      }
      #status code {
          font-size: 90%;
          font-weight: 700;
          margin-left: 3px;
          margin-right: 3px;
          border-bottom: 1px dashed rgba(255,255,255,0.3);
      }

      .is-seed #hero {
          background-color: #154820;
          transition: .5s .5s background-color ease-in-out;
      }
      #hero {
          background-color: #2a3749;
      }
      #status {
          color: #fff;
          font-size: 17px;
          padding: 5px;
      }
      a:link, a:visited {
          color: #30a247;
          text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div id="hero">
      <div id="output">
        <div id="progressBar"></div>
        <!-- The video player will be added here -->
      </div>
      <!-- Statistics -->
      <div id="status">
        <div>
          <span class="show-leech">Downloading </span>
          <span class="show-seed">Seeding </span>
          <code>
            <!-- Informative link to the torrent file -->
            <a id="torrentLink" href="https://webtorrent.io/torrents/sintel.torrent">sintel.torrent</a>
          </code>
          <span class="show-leech"> from </span>
          <span class="show-seed"> to </span>
          <code id="numPeers">0 peers</code>.
        </div>
        <div>
          <code id="downloaded"></code>
          of <code id="total"></code>
          — <span id="remaining"></span><br/>
          &#x2198;<code id="downloadSpeed">0 b/s</code>
          / &#x2197;<code id="uploadSpeed">0 b/s</code>
        </div>
      </div>
    </div>
    <!-- Include the latest version of WebTorrent -->
    <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>

    <!-- Moment is used to show a human-readable remaining time -->
    <script src="http://momentjs.com/downloads/moment.min.js"></script>

    <script>
      // const torrentId = 'magnet:?xt=urn:btih:f248b6b29281eeb2b4d89edc4d392b70e534df03&dn=The.Big.Short.2015.DVDScr.XVID.AC3.HQ.Hive-CM8'
      const torrentId = 'magnet:?xt=urn:btih:8de401c82c44039eb11202ae1f35035bcb33998e&dn=X-Men.Days.of.Future.Past.2014.Xmen.2160p.UHD.BluRay.x265.HDR.10&tr=wss%3A%2F%2Ftracker.btorrent.xyz&tr=wss%3A%2F%2Ftracker.openwebtorrent.com'

      // const torrentId = 'https://webtorrent.io/torrents/sintel.torrent'

      const client = new WebTorrent()

      // HTML elements
      const $body = document.body
      const $progressBar = document.querySelector('#progressBar')
      const $numPeers = document.querySelector('#numPeers')
      let peerCount = 0;
      let peerTimeout = null;
      const $downloaded = document.querySelector('#downloaded')
      const $total = document.querySelector('#total')
      const $remaining = document.querySelector('#remaining')
      const $uploadSpeed = document.querySelector('#uploadSpeed')
      const $downloadSpeed = document.querySelector('#downloadSpeed')

      // Download the torrent
      client.add(torrentId, function (torrent) {
        function updatePeerCount() {
          $numPeers.textContent = `${peerCount} peer${peerCount === 1 ? '' : 's'}`;
          console.log(`Peer count updated: ${peerCount}`);
        }
        torrent.on('wire', function(wire) {
          peerCount++;
          console.log('New peer connected:', wire.remoteAddress || wire.remotePeerId || wire);
          updatePeerCount();
        });
        // Warn if no peers after 10 seconds
        peerTimeout = setTimeout(function() {
          if (peerCount === 0) {
            const msg = 'No WebRTC peers found. Streaming only works if another browser is seeding or a web seed is available.';
            $numPeers.textContent = msg;
            $numPeers.style.color = 'red';
            console.warn(msg);
            // Fallback: show download link
            const downloadDiv = document.createElement('div');
            downloadDiv.innerHTML = `
              <p class="mt-4 text-sm text-gray-700">Streaming unavailable. <a href="${torrentId}" class="text-blue-600 underline" download>Download and play</a> in your favorite player.</p>
            `;
            document.getElementById('status').appendChild(downloadDiv);
          }
        }, 10000);

        // Torrents can contain many files. Try to find a playable video file
        console.log('Available files:', torrent.files.map(f => f.name));
        const file = torrent.files.find(f => /\.(mp4|mkv|webm|avi)$/i.test(f.name));
        if (file) {
          file.appendTo('#output');
        } else {
          const msg = 'No playable video file (.mp4, .mkv, .webm, .avi) found in this torrent.';
          console.warn(msg);
          const noVideoDiv = document.createElement('div');
          noVideoDiv.innerHTML = `<p class="mt-4 text-sm text-red-600">${msg}</p>`;
          document.getElementById('status').appendChild(noVideoDiv);
        }

        // Trigger statistics refresh
        torrent.on('done', onDone)
        setInterval(onProgress, 500)
        onProgress()

        // Statistics
        function onProgress () {
          // Peers
          $numPeers.innerHTML = torrent.numPeers + (torrent.numPeers === 1 ? ' peer' : ' peers')

          // Progress
          const percent = Math.round(torrent.progress * 100 * 100) / 100
          $progressBar.style.width = percent + '%'
          $downloaded.innerHTML = prettyBytes(torrent.downloaded)
          $total.innerHTML = prettyBytes(torrent.length)

          // Remaining time
          let remaining
          if (torrent.done) {
            remaining = 'Done.'
          } else {
            remaining = moment.duration(torrent.timeRemaining / 1000, 'seconds').humanize()
            remaining = remaining[0].toUpperCase() + remaining.substring(1) + ' remaining.'
          }
          $remaining.innerHTML = remaining

          // Speed rates
          $downloadSpeed.innerHTML = prettyBytes(torrent.downloadSpeed) + '/s'
          $uploadSpeed.innerHTML = prettyBytes(torrent.uploadSpeed) + '/s'
        }
        function onDone () {
          $body.className += ' is-seed'
          onProgress()
        }
      })

      // Human readable bytes util
      function prettyBytes(num) {
        const units = ['B', 'kB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB']
        const neg = num < 0
        if (neg) num = -num
        if (num < 1) return (neg ? '-' : '') + num + ' B'
        const exponent = Math.min(Math.floor(Math.log(num) / Math.log(1000)), units.length - 1)
        const unit = units[exponent]
        num = Number((num / Math.pow(1000, exponent)).toFixed(2))
        return (neg ? '-' : '') + num + ' ' + unit
      }
    </script>
  </body>
</html>
